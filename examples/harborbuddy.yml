# HarborBuddy configuration example. Environment variables override these values.
# Safe helper-based self-update is enabled by default. Set the environment variable
# HARBORBUDDY_SELF_UPDATE_ENABLED=false to opt out while retaining other updates.

docker:
  # Empty uses standard Docker SDK variables such as DOCKER_HOST,
  # DOCKER_TLS_VERIFY, DOCKER_CERT_PATH, and DOCKER_API_VERSION.
  host: ""

updates:
  enabled: true

  # Set schedule_time for a daily run, or leave it empty to use check_interval.
  check_interval: 12h
  schedule_time: "03:00"
  timezone: America/Los_Angeles

  # Dry-run still pulls eligible images, but never recreates/deletes containers
  # and never removes any cleanup resource or build cache.
  dry_run: false

  # Deny patterns take precedence. One wildcard is supported at either edge.
  allow_images:
    - "*"
  deny_images:
    - "postgres:*"
    - "mysql:*"

  stop_timeout: 10s
  startup_timeout: 30s

  # Keep this many prior known-working images per full image reference.
  # Zero disables rollback image retention.
  rollback_image_retention: 0

cleanup:
  enabled: true
  min_age_hours: 24
  dangling_only: true

  # Every broader cleanup category is opt-in. Setting all: true enables all
  # four categories below and includes unused tagged images.
  all: false
  stopped_containers: false
  unused_networks: false
  unused_volumes: false
  build_cache: false
  # Optional shorter ages (default: min_age_hours):
  # dangling_image_min_age_hours: 1
  # cache_volumes: ["*gocache", "*gomod"]  # volume-name globs
  # cache_volume_min_age_hours: 1
  # Images cleanup never removes (allow/deny pattern syntax), e.g. host tools:
  # keep_images: ["openthread/border-router:*"]
  # Volume-name globs cleanup never removes, e.g. backup stores:
  # keep_volumes: ["*-backups"]
  # Volume labels that keep a volume ("key=value", or "key" for any value):
  # keep_volume_labels: ["com.example.keep=true"]

log:
  level: info
  # JSON is recommended for unattended production instances.
  json: false
  file: ""
  max_size: 10
  max_backups: 1
