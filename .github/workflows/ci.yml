name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting and source limits
        run: make fmt-check source-limits

      - name: Run go vet
        run: make vet

      - name: Run tests with coverage
        run: make test-cover

      - name: Write coverage summary
        if: always() && hashFiles('coverage-packages.txt') != ''
        run: |
          {
            printf '## Package coverage\n\n```text\n'
            cat coverage-packages.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.out
            coverage-packages.txt
          retention-days: 14

      - name: Run race detector
        run: make test-race

      - name: Build binary with reproducible metadata
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          DATE="$(git show -s --format=%cI HEAD)"
          make build VERSION="$VERSION" COMMIT="$COMMIT" DATE="$DATE"
          ./harborbuddy --version

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go linters
        run: make lint

      - name: Check reachable vulnerabilities
        run: make vuln

      - name: Lint GitHub Actions
        env:
          ACTIONLINT_SHELLCHECK: ./test/shellcheck-pinned.sh
        run: make lint-actions

      - name: Lint shell scripts
        run: ./test/shellcheck-pinned.sh test/*.sh

      - name: Lint Dockerfile
        run: >-
          docker run --rm
          --volume "$PWD:/work:ro"
          hadolint/hadolint:v2.15.0-alpine@sha256:ddabce597257a5b466cc60878090de88b0fd191b84eb7652bddfe88ad192d0d5
          --config /work/.hadolint.yaml
          /work/Dockerfile

      - name: Install pinned yamllint
        run: python3 -m pip install --disable-pip-version-check yamllint==1.38.0

      - name: Lint YAML
        run: python3 -m yamllint -c .yamllint.yml .github examples

      - name: Verify action pins
        run: ./test/check-action-pins.sh

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Prepare build metadata
        id: build
        shell: bash
        run: printf 'date=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build loadable image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: harborbuddy:ci
          build-args: |
            VERSION=0.0.0-ci.${{ github.run_number }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64

      - name: Run image
        run: |
          docker run --rm harborbuddy:ci --version
          test "$(docker image inspect harborbuddy:ci --format '{{ index .Config.Labels "com.harborbuddy.role" }}')" = daemon

      - name: Run Docker integration test
        run: ./test/integration.sh
