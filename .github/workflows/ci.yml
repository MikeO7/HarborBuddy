name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Go verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting and source limits
        run: make fmt-check source-limits

      - name: Run go vet
        run: make vet

      - name: Run tests with coverage
        run: make test-cover

      - name: Write coverage summary
        if: always() && hashFiles('coverage-packages.txt') != ''
        run: |
          {
            printf '## Package coverage\n\n```text\n'
            cat coverage-packages.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always() && hashFiles('coverage.out') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.out
            coverage-packages.txt
          retention-days: 14

      - name: Run race detector
        run: make test-race

      - name: Build binary with reproducible metadata
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: |
          DATE="$(git show -s --format=%cI HEAD)"
          make build VERSION="$VERSION" COMMIT="$COMMIT" DATE="$DATE"
          ./harborbuddy --version

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Go linters
        run: make lint

      - name: Check reachable vulnerabilities
        run: make vuln

      - name: Lint GitHub Actions
        env:
          ACTIONLINT_SHELLCHECK: ./test/shellcheck-pinned.sh
        run: make lint-actions

      - name: Lint shell scripts
        run: ./test/shellcheck-pinned.sh test/*.sh

      - name: Lint Dockerfile
        run: >-
          docker run --rm
          --volume "$PWD:/work:ro"
          --entrypoint hadolint
          hadolint/hadolint:v2.15.1-alpine@sha256:a1d49ae1a4e83c1dbad26b8c1ad7588c8bd1e04f4866b34ad3cac50335198552
          --config /work/.hadolint.yaml
          /work/Dockerfile

      - name: Install pinned yamllint
        run: python3 -m pip install --disable-pip-version-check yamllint==1.38.0

      - name: Lint YAML
        run: python3 -m yamllint -c .yamllint.yml .github examples

      - name: Verify action pins
        run: ./test/check-action-pins.sh

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  container-smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare build metadata
        id: build
        shell: bash
        run: printf 'date=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build loadable image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: harborbuddy:ci
          build-args: |
            VERSION=0.0.0-ci.${{ github.run_number }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64

      - name: Run image
        run: |
          docker run --rm harborbuddy:ci --version
          test "$(docker image inspect harborbuddy:ci --format '{{ index .Config.Labels "com.harborbuddy.role" }}')" = daemon

      - name: Run Docker integration test
        run: ./test/integration.sh

      - name: Run Podman integration test
        shell: bash
        run: |
          registries_dir="$HOME/.config/containers"
          mkdir -p "$registries_dir"
          cat >"$registries_dir/registries.conf" <<'EOF'
          unqualified-search-registries = ["docker.io"]

          [[registry]]
          location = "localhost"
          insecure = true
          EOF
          socket="$RUNNER_TEMP/podman/podman.sock"
          mkdir -p "$(dirname "$socket")"
          podman system service --time=0 "unix://$socket" >"$RUNNER_TEMP/podman-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for _ in {1..50}; do
            [[ -S "$socket" ]] && break
            sleep 0.1
          done
          [[ -S "$socket" ]] || {
            cat "$RUNNER_TEMP/podman-service.log" >&2
            exit 1
          }
          ENGINE_SOCKET="$socket" make test-integration CONTAINER_ENGINE="$(command -v podman)"
