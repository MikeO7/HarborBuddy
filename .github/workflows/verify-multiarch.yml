name: Multi-Platform Runtime Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * 0"

permissions:
  contents: read

concurrency:
  group: multiarch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            expected: linux/amd64
          - platform: linux/arm64
            slug: arm64
            expected: linux/arm64
          - platform: linux/arm/v7
            slug: armv7
            expected: linux/arm
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Prepare build date
        id: build
        shell: bash
        run: |
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build platform image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: harborbuddy:smoke-${{ matrix.slug }}
          build-args: |
            VERSION=0.0.0-smoke
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=smoke-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.slug }}

      - name: Run platform image
        shell: bash
        run: |
          output="$(docker run --rm \
            --platform '${{ matrix.platform }}' \
            'harborbuddy:smoke-${{ matrix.slug }}' \
            --version)"
          printf '%s\n' "$output"
          grep -q 'HarborBuddy' <<< "$output"
          grep -q '${{ matrix.expected }})$' <<< "$output"
          test "$(docker image inspect 'harborbuddy:smoke-${{ matrix.slug }}' --format '{{ index .Config.Labels "com.harborbuddy.role" }}')" = daemon
