name: Multi-Platform Runtime Verification

on:
  workflow_dispatch:
  schedule:
    - cron: "7 3 * * 0"

permissions:
  contents: read

concurrency:
  group: multiarch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: amd64
            expected: linux/amd64
          - platform: linux/arm64
            slug: arm64
            expected: linux/arm64
          - platform: linux/arm/v7
            slug: armv7
            expected: linux/arm
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64,arm

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Prepare build date
        id: build
        shell: bash
        run: |
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: harborbuddy:smoke-${{ matrix.slug }}
          build-args: |
            VERSION=0.0.0-smoke
            COMMIT=${{ github.sha }}
            DATE=${{ steps.build.outputs.date }}
          cache-from: type=gha,scope=smoke-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=smoke-${{ matrix.slug }}

      - name: Run platform image
        shell: bash
        run: |
          output="$(docker run --rm \
            --platform '${{ matrix.platform }}' \
            'harborbuddy:smoke-${{ matrix.slug }}' \
            --version)"
          printf '%s\n' "$output"
          grep -q 'HarborBuddy' <<< "$output"
          grep -q '${{ matrix.expected }})$' <<< "$output"
          test "$(docker image inspect 'harborbuddy:smoke-${{ matrix.slug }}' --format '{{ index .Config.Labels "com.harborbuddy.role" }}')" = daemon
